name: CI

# Each step is named by role; Code/README.md maps roles to commands.

on:
  pull_request:
    # The integration branch (default `main`). Add `staging` here if the project uses one.
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code/package-lock.json

      - name: setup
        run: npm ci

      - name: lint
        run: npm run lint

      - name: check
        run: npm run check

      # `build` regenerates tokens first, so this also catches a token pipeline that no
      # longer builds, a token that lost its alpha, and a dev-only page that leaked.
      - name: build
        run: npm run build

      # Prints the deviation summary. Deviations are warnings: this step exits 0 when any
      # exist. `--strict` is a local-only flag and is not used here.
      - name: validate
        run: npm run validate

      - name: test
        run: npm test

      # Build and validation regenerate tracked files (the unpacked Figma token JSON and
      # the deviations backlog). A stale committed copy is what fails the job.
      - name: tracked files are up to date
        run: git diff --exit-code

  e2e:
    needs: verify
    # Pinned: @playwright/test 1.56.1 can't install Chromium on ubuntu-latest (26.04).
    # Move this forward together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code/package-lock.json

      - name: setup
        run: npm ci

      - name: install browser
        run: npx playwright install --with-deps chromium

      - name: e2e
        run: npm run e2e
        env:
          CI: 'true'

      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Code/playwright-report
          retention-days: 7
